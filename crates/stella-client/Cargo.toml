[package]
name = "stella-client"
description = "Stella Layer-2 virtual LAN client"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
stella-common = { path = "../stella-common" }
stella-control = { path = "../stella-control" }
stella-crypto = { path = "../stella-crypto" }
stella-proto = { path = "../stella-proto" }
stella-tap = { path = "../stella-tap" }
stella-transport = { path = "../stella-transport" }
subtle = { version = "2.6.1", default-features = false }
thiserror.workspace = true
toml = "0.9.8"
tokio = { workspace = true, features = ["io-util", "net", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
x509-parser = { version = "=0.18.1", default-features = false }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
stella-server = { path = "../stella-server" }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-acl = "=0.3.0"

[lints]
workspace = true
