[package]
name = "stella-client"
description = "Stella Layer-2 virtual LAN client"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow = "=1.0.104"
atomic-write-file = "=0.3.1"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
clap = { version = "=4.6.6", features = ["derive"] }
getrandom = "0.4.3"
hmac = "=0.13.0"
if-addrs = "=0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "=0.11.0"
stella-common = { path = "../stella-common" }
stella-control = { path = "../stella-control" }
stella-crypto = { path = "../stella-crypto" }
stella-proto = { path = "../stella-proto" }
stella-tap = { path = "../stella-tap" }
stella-transport = { path = "../stella-transport" }
subtle = { version = "2.6.1", default-features = false }
thiserror.workspace = true
toml = "0.9.8"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
webpki-roots = "=1.0.9"
x509-parser = { version = "=0.18.1", default-features = false }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
stella-server = { path = "../stella-server" }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-acl = "=0.3.0"

[lints]
workspace = true
