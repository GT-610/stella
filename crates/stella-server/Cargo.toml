[package]
name = "stella-server"
description = "Self-hosted Stella control-plane server"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow = "=1.0.104"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
clap = { version = "=4.6.6", features = ["derive"] }
getrandom = "0.4.3"
redb = "=2.6.3"
serde = { version = "1.0.229", features = ["derive"] }
stella-common = { path = "../stella-common" }
stella-crypto = { path = "../stella-crypto" }
stella-proto = { path = "../stella-proto" }
stella-transport = { path = "../stella-transport" }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
toml = "0.9.8"
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-acl = "=0.3.0"

[lints]
workspace = true
