[package]
name = "stella-server"
description = "Self-hosted Stella control-plane server"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow = "=1.0.104"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
clap = { version = "=4.6.6", features = ["derive"] }
getrandom = "0.4.3"
futures-util.workspace = true
hmac = "=0.13.0"
rcgen = { version = "=0.14.7", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
redb = "=2.6.3"
rustls-pemfile = "=2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "=0.11.0"
stella-common = { path = "../stella-common" }
stella-control = { path = "../stella-control" }
stella-crypto = { path = "../stella-crypto" }
stella-proto = { path = "../stella-proto" }
stella-transport = { path = "../stella-transport" }
thiserror.workspace = true
time = "=0.3.44"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
tokio-tungstenite.workspace = true
toml = "0.9.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-acl = "=0.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[lints]
workspace = true
