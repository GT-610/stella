[package]
name = "stella-crypto"
description = "Identity and packet protection for Stella"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
sha2 = "0.11.0"
stella-common = { path = "../stella-common" }
subtle = { version = "2.6.1", default-features = false }
thiserror.workspace = true
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
stella-proto = { path = "../stella-proto" }

[lints]
workspace = true
