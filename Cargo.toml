[workspace]
members = [
    "crates/stella-client",
    "crates/stella-common",
    "crates/stella-control",
    "crates/stella-crypto",
    "crates/stella-file-security",
    "crates/stella-proto",
    "crates/stella-server",
    "crates/stella-tap",
    "crates/stella-transport",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/GT-610/stella"
rust-version = "1.85"
version = "0.2.0"

[workspace.dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
