[workspace]
members = [
    "crates/stella-client",
    "crates/stella-common",
    "crates/stella-crypto",
    "crates/stella-proto",
    "crates/stella-server",
    "crates/stella-tap",
    "crates/stella-transport",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/GT-610/stella"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
